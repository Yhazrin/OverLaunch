name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test isolated core
        run: ./scripts/test.sh
      - name: Compile launcher
        run: swift build -c release
      - name: Verify bundled font
        run: python3 scripts/verify-font-assets.py
