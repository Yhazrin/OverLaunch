name: macOS beta release
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-beta-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cancel superseded beta publication jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" --paginate \
            --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"in_progress\")) | .id" \
            > "$RUNNER_TEMP/superseded-beta-runs"
          while read -r run; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel"
          done < "$RUNNER_TEMP/superseded-beta-runs"
      - name: Validate release target and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          swift --version
          python3 - <<'PY'
          import json, os
          release = json.load(open('release.json'))
          assert os.environ['GITHUB_REF'] == 'refs/tags/' + release['tag'], 'Run against the exact release tag'
          assert release['channel'] == 'beta'
          PY
      - name: Test core and compile/package app
        run: |
          set -euo pipefail
          ./scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/overlaunch-release.log"
          ./scripts/package.sh 2>&1 | tee -a "$RUNNER_TEMP/overlaunch-release.log"
          hdiutil verify "dist.noindex/OverLaunch-$(python3 -c 'import json; print(json.load(open("release.json"))["artifactVersion"])')-arm64.dmg"
      - name: Exercise fresh Wine prefix without game or account
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          export OW120_ROOT="$RUNNER_TEMP/overlaunch-fresh-smoke"
          swift run -c release OW120 --prepare-fresh 2>&1 | tee -a "$RUNNER_TEMP/overlaunch-release.log"
          swift run -c release OW120 --verify-runtime
          swift run -c release OW120 --smoke-test
          swift run -c release OW120 --stop
      - name: Surface release diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'overlaunch-release.log'
          if log.exists():
              lines = [line for line in log.read_text(errors='replace').splitlines()
                       if 'error:' in line or 'failed' in line.lower() or 'OverLaunch:' in line]
              for line in lines[-25:]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
          PYTHON
      - name: Collect distributable files and corresponding DXMT source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist.noindex/OverLaunch-*-arm64.dmg release-assets/
          curl --fail --location --retry 2 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/NerRobDog/dxmt/archive/c5dc3a0dfe9108e667da43de871324bd298c9c02.tar.gz \
            -o release-assets/DXMT-c5dc3a0-source.tar.gz
          (cd release-assets && shasum -a 256 *.dmg *.tar.gz > SHA256SUMS)
      - name: Publish prerelease only after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(python3 -c 'import json; print(json.load(open("release.json"))["tag"])')"
          gh release create "$TAG" release-assets/* --verify-tag --prerelease \
            --title "OverLaunch $TAG" --notes-file RELEASE_NOTES.md
